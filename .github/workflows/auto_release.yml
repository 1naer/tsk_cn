# auto_release.yml — 星骑士汉化包自动检测更新 + 合包 + 签名 + 发布 Release
#
# 作用：全自动闭环，无需人工干预——
#   1. 定时（或手动）触发，通过 Vercel 代理调 DMM 官方 API 检测新版本
#   2. 有新版本则拉取官方 APK，校验包名/版本/哈希
#   3. 按新版 IL2CPP 重新生成 interop（提取 libil2cpp.so + global-metadata.dat → Cpp2IL → 按旧清单安全筛选），失败则回退仓库内静态 interop
#   4. 合包（LemonLoader + payload.json + .NET 运行时 + ARTEAM 悬浮窗 + libunity patchelf 修补）
#   5. zipalign + apksigner 用固定密钥签名（V1+V2+V3）
#   6. 自动发布到 GitHub Release，APK 作为可下载资产
#
# 触发方式：
#   - schedule：每天 03:17 UTC 自动检测一次（DMM 更新后最迟当天拿到）
#   - workflow_dispatch：手动触发，可强制重建
#
# 需要配置的 Secret（仓库 Settings → Secrets and variables → Actions）：
#   - KS_BASE64   : 签名 keystore（tsk_fixed.keystore）的 Base64 内容
#                   （本地命令：base64 -w0 tsk_fixed.keystore）
#   - KS_PASSWORD : keystore 密码
#
# 说明：APK 是构建产物不入 git，只通过 Release 资产分发；签名密钥仅以 Secret 注入。

name: 自动检测更新并发布

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建并发布（忽略版本比对）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TSK_KS_PASS: ${{ secrets.KS_PASSWORD }}

jobs:
  release:
    name: 检测 → 合包 → 签名 → 发布
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 JDK（提供 keytool / apksigner 运行环境）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装构建工具（patchelf + zipalign + aapt）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf >/dev/null 2>&1
          # zipalign / aapt 来自 Android build-tools，下载最小构建工具包
          BT_VER="34.0.0"
          ANDROID_HOME="${{ runner.temp }}/android-sdk"
          mkdir -p "$ANDROID_HOME/build-tools"
          # 注意：dl.google.com 已下架 build-tools_r34.0.0-linux.zip（404），
          # 必须使用等价的 build-tools_r34-linux.zip（同为 34.0.0，解压目录为 android-14）
          BT_URL="https://dl.google.com/android/repository/build-tools_r34-linux.zip"
          echo "下载 Android build-tools ${BT_VER}..."
          curl -fL --retry 5 -o /tmp/bt.zip "$BT_URL"
          unzip -q /tmp/bt.zip -d /tmp/bt
          BT_DIR=$(find /tmp/bt -maxdepth 1 -type d -name "android-*" | head -1)
          mv "$BT_DIR" "$ANDROID_HOME/build-tools/$BT_VER"
          chmod +x "$ANDROID_HOME/build-tools/$BT_VER/"* 2>/dev/null || true
          echo "$ANDROID_HOME/build-tools/$BT_VER" >> "$GITHUB_PATH"
          echo "build-tools 已就位: $ANDROID_HOME/build-tools/$BT_VER"
          zipalign -h 2>&1 | head -1 || true
          aapt version 2>&1 | head -1 || true

      - name: 准备签名密钥
        run: |
          set -euo pipefail
          mkdir -p keystore
          echo "${{ secrets.KS_BASE64 }}" | base64 -d > keystore/tsk_fixed.keystore
          keytool -list -alias tsk_fixed_key -keystore keystore/tsk_fixed.keystore \
            -storepass "$TSK_KS_PASS" 2>&1 | grep -i 'SHA-256' || {
              echo "::error::签名密钥读取失败，请检查 KS_BASE64 / KS_PASSWORD"
              exit 1
            }

      - name: 检测 DMM 新版本并拉取官方 APK
        run: |
          set -euo pipefail
          mkdir -p work
          if [ -f work/last_version.json ]; then
            echo "=== 上次记录版本 ==="
            cat work/last_version.json
          else
            echo "=== 首次运行，无历史版本记录 ==="
          fi
          EXTRA=""
          [ "${{ github.event.inputs.force }}" = "true" ] && EXTRA="--force"
          python3 scripts/00_fetch_dmm.py --output work/official.apk $EXTRA

      - name: 判断是否有新包需要发布
        id: check
        run: |
          set -euo pipefail
          if [ ! -f work/official.apk ]; then
            echo "无更新或下载未完成，跳过本次发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER=$(python3 -c "import json;print(json.load(open('work/last_version.json'))['version_name'])")
          echo "有新版本: $VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 校验官方 APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          aapt dump badging work/official.apk | grep "package:" | head -1
          sha256sum work/official.apk

      - name: 安装 .NET SDK（供 Cpp2IL 生成 interop）
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 重新生成 interop（按新版 IL2CPP；失败自动回退静态 interop）
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          # 目标：产出 work/interop 供 02_assemble.py 的 inject_lemon 优先使用。
          # 本步骤为「增强」而非「必需」：任何一步失败都回退到仓库内静态 interop，
          # 绝不因为 interop 生成失败而阻断整条发布链（合包脚本会打印来源=静态）。
          set -uo pipefail
          ARCH=arm64-v8a
          rm -rf work/interop work/il2cpp gen_out gen_interop_selected
          mkdir -p work/il2cpp
          unzip -j work/official.apk \
            "lib/${ARCH}/libil2cpp.so" \
            "assets/bin/Data/Managed/Metadata/global-metadata.dat" \
            -d work/il2cpp/ || { echo "::warning::提取 IL2CPP 核心文件失败，回退静态 interop"; exit 0; }
          ls -l work/il2cpp/

          mkdir -p tools && cd tools
          CPP2IL_REPO="${{ secrets.CPP2IL_REPO || 'Cpp2IL/Cpp2IL' }}"
          CPP2IL_REF="${{ secrets.CPP2IL_REF }}"
          if [ -n "$CPP2IL_REF" ]; then
            URL="https://github.com/${CPP2IL_REPO}/releases/download/${CPP2IL_REF}/Cpp2IL.zip"
          else
            URL="https://github.com/${CPP2IL_REPO}/releases/latest/download/Cpp2IL.zip"
          fi
          curl -fL --retry 5 -o cpp2il.zip "$URL" || { echo "::warning::Cpp2IL 下载失败，回退静态 interop"; exit 0; }
          unzip -o cpp2il.zip >/dev/null 2>&1 || true
          CPP2IL_BIN=""
          for c in Cpp2IL.dll Cpp2IL Cpp2IL.exe; do [ -f "$c" ] && CPP2IL_BIN="$c" && break; done
          [ -n "$CPP2IL_BIN" ] || { echo "::warning::未找到 Cpp2IL 可执行文件，回退静态 interop"; exit 0; }
          if [[ "$CPP2IL_BIN" == *.dll ]]; then
            dotnet "$CPP2IL_BIN" -lib ../work/il2cpp/libil2cpp.so -metadata ../work/il2cpp/global-metadata.dat -output-dir ../gen_out \
              || { echo "::warning::Cpp2IL 运行失败，回退静态 interop"; exit 0; }
          else
            "./$CPP2IL_BIN" -lib ../work/il2cpp/libil2cpp.so -metadata ../work/il2cpp/global-metadata.dat -output-dir ../gen_out \
              || { echo "::warning::Cpp2IL 运行失败，回退静态 interop"; exit 0; }
          fi
          cd ..
          python3 scripts/select_interop.py gen_out static/lemon/runtime/interop work/interop \
            || { echo "::warning::interop 筛选失败，回退静态 interop"; rm -rf work/interop; exit 0; }
          N=$(ls work/interop/*.dll 2>/dev/null | wc -l)
          [ "$N" -gt 0 ] || { echo "::warning::重生成 interop 为空，回退静态 interop"; rm -rf work/interop; exit 0; }
          echo "已重生成 interop: ${N} 个 DLL（合包时将标记 来源=重生成）"

      - name: 合包 + 签名
        if: steps.check.outputs.skip == 'false'
        env:
          VER: ${{ steps.check.outputs.ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/TSK_${VER}_cn_float.apk"
          python3 scripts/02_assemble.py work/official.apk "$OUT"
          ls -l "$OUT"

      - name: 发布到 GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.check.outputs.ver }}"
          name: "TSK 汉化版 ${{ steps.check.outputs.ver }}"
          body: |
            ## 星骑士汉化版自动发布

            - 官方源版本：${{ steps.check.outputs.ver }}
            - 构建方式：GitHub Actions 自动检测 DMM 更新 → 合包 → 签名
            - 签名：V1+V2+V3，固定密钥（同证书可覆盖安装）

            安装前请先卸载旧版（或同证书直接覆盖安装）。
          files: |
            dist/TSK_*_cn_float.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
