# interop_gen.yml — 星骑士 IL2CPP Interop 自动生成工作流
#
# 作用：拿到新官方 APK 后，自动提取 libil2cpp.so + global-metadata.dat，
#       用 Cpp2IL 重新生成 interop 程序集，按旧清单安全筛选后，
#       回填到 static/lemon/runtime/interop，供后续合包使用。
#
# 触发方式：
#   - 手动触发（推荐）：在 Actions 页面选 "生成 Interop"，填入官方 APK 的
#     直链 URL（以及可选的 SHA-256 用于校验）。
#   - 也支持被其它 workflow 用 workflow_run 联动。
#
# 需要配置的 Secret：
#   - CPP2IL_REPO     : Cpp2IL 的 GitHub 仓库（默认 Cpp2IL/Cpp2IL）
#   - CPP2IL_REF      : Cpp2IL 的 release tag/分支（留空则取 latest release）
#   - GITHUB_TOKEN    : 自动可用（用于 artifact 上传 / 可选回提交 interop）
#
# 说明：Cpp2IL 的具体 CLI 参数因版本而异，下方 CPP2IL_ARGS 已抽成变量，
#       若你的 Cpp2IL 版本参数不同，改环境变量即可，无需改逻辑。

name: 生成 Interop

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: '官方 APK 直链 URL'
        required: true
        type: string
      apk_sha256:
        description: '官方 APK 的 SHA-256（可选，填了会校验）'
        required: false
        type: string
      arch:
        description: '目标架构（默认 arm64-v8a）'
        required: false
        default: 'arm64-v8a'
        type: string
      commit_back:
        description: '是否把新 interop 回提交到仓库'
        required: false
        default: false
        type: boolean

  workflow_run:
    workflows: ['触发合包']   # 如需联动，取消注释并确保存在该 workflow
    types: [completed]

permissions:
  contents: write   # 仅在 commit_back=true 时用于回提交 interop

concurrency:
  group: interop-gen-${{ github.ref }}
  cancel-in-progress: true

env:
  CPP2IL_REPO: ${{ secrets.CPP2IL_REPO || 'Cpp2IL/Cpp2IL' }}
  CPP2IL_REF:  ${{ secrets.CPP2IL_REF }}
  # Cpp2IL 参数模板：按你实际版本调整。常见形式：
  #   -lib <so> -metadata <dat> -output-dir <dir>
  CPP2IL_ARGS: '-lib libil2cpp.so -metadata global-metadata.dat -output-dir out'

jobs:
  # ---------- 步骤 1：下载 APK 并提取 IL2CPP 核心文件 ----------
  extract:
    name: 提取 libil2cpp.so + global-metadata.dat
    runs-on: ubuntu-latest
    steps:
      - name: 下载官方 APK
        run: |
          set -euo pipefail
          mkdir -p apk
          echo "下载: ${{ github.event.inputs.apk_url || github.event.workflow_run.head_sha }}"
          curl -fL --retry 5 --retry-delay 3 \
            -o apk/base.apk \
            "${{ github.event.inputs.apk_url }}"

      - name: 校验 SHA-256（若提供）
        if: ${{ github.event.inputs.apk_sha256 != '' }}
        run: |
          echo "${{ github.event.inputs.apk_sha256 }}  apk/base.apk" | sha256sum -c -

      - name: 解压并提取 IL2CPP 文件
        env:
          ARCH: ${{ github.event.inputs.arch || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          mkdir -p work
          # libil2cpp.so（按架构）+ global-metadata.dat
          unzip -j apk/base.apk \
            "lib/${ARCH}/libil2cpp.so" \
            "assets/bin/Data/Managed/Metadata/global-metadata.dat" \
            -d work/
          ls -l work/
          # 记录输入指纹，便于追溯
          sha256sum work/libil2cpp.so work/global-metadata.dat | tee work/fingerprint.txt

      - name: 上传提取产物
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp-core
          path: work/
          retention-days: 14

  # ---------- 步骤 2：Cpp2IL 生成 interop ----------
  gen_interop:
    name: Cpp2IL 生成 Interop
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库与脚本
        uses: actions/checkout@v4

      - name: 下载 IL2CPP 核心文件
        uses: actions/download-artifact@v4
        with:
          name: il2cpp-core
          path: work/

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 获取 Cpp2IL 工具
        env:
          REPO: ${{ env.CPP2IL_REPO }}
          REF:  ${{ env.CPP2IL_REF }}
        run: |
          set -euo pipefail
          mkdir -p tools && cd tools
          if [ -n "$REF" ]; then
            RELEASE_URL="https://github.com/${REPO}/releases/download/${REF}/Cpp2IL.zip"
          else
            # 取 latest release 的 zip（按你的发布资产命名调整）
            RELEASE_URL="https://github.com/${REPO}/releases/latest/download/Cpp2IL.zip"
          fi
          echo "下载 Cpp2IL: $RELEASE_URL"
          curl -fL --retry 5 -o cpp2il.zip "$RELEASE_URL" || {
            echo "::warning::Cpp2IL 下载失败，请检查 CPP2IL_REPO/CPP2IL_REF 与资产命名，或改用 dotnet tool 安装"
            # 兜底：尝试 dotnet tool 安装（若工具以 dotnet-tool 形式分发）
            dotnet tool install --global Cpp2IL || true
            exit 0
          }
          unzip -o cpp2il.zip
          find . -maxdepth 2 -type f | head -20

      - name: 运行 Cpp2IL 生成程序集
        working-directory: tools
        run: |
          set -euo pipefail
          # 优先用下载的 DLL/exe
          CPP2IL_BIN=""
          for c in Cpp2IL.dll Cpp2IL Cpp2IL.exe; do
            [ -f "$c" ] && CPP2IL_BIN="$c" && break
          done
          if [ -z "$CPP2IL_BIN" ]; then
            echo "::error::未找到 Cpp2IL 可执行文件，请检查 tools/ 目录内容"
            exit 1
          fi
          # 统一参数：相对路径指向仓库根的 work/ 与 gen_out
          if [[ "$CPP2IL_BIN" == *.dll ]]; then
            dotnet "$CPP2IL_BIN" \
              -lib ../../work/libil2cpp.so \
              -metadata ../../work/global-metadata.dat \
              -output-dir ../../gen_out
          else
            "$CPP2IL_BIN" \
              -lib ../../work/libil2cpp.so \
              -metadata ../../work/global-metadata.dat \
              -output-dir ../../gen_out
          fi
          echo "=== 生成结果 ==="
          find ../../gen_out -name '*.dll' | wc -l

      - name: 安全筛选 interop（按旧清单同名替换）
        run: |
          set -euo pipefail
          python3 scripts/select_interop.py \
            gen_out \
            static/lemon/runtime/interop \
            gen_interop_selected
          ls -l gen_interop_selected | head

      - name: 上传新 interop（供合包流程使用）
        uses: actions/upload-artifact@v4
        with:
          name: interop-new
          path: gen_interop_selected/
          retention-days: 30

      - name: 回提交 interop 到仓库（可选）
        if: ${{ github.event.inputs.commit_back == 'true' }}
        run: |
          set -euo pipefail
          # 备份旧的，替换为新筛选结果
          cp -r static/lemon/runtime/interop static/lemon/runtime/interop.bak
          rm -f static/lemon/runtime/interop/*.dll
          cp gen_interop_selected/*.dll static/lemon/runtime/interop/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/lemon/runtime/interop
          if git diff --cached --quiet; then
            echo "interop 无变化，跳过提交"
          else
            git commit -m "chore: 更新 interop（新版自动生成）"
            git push
          fi
